# Install on fjall in the am32.tridgell.net virtual host.  This Alias is
# evaluated by the host Apache, independently of the existing application
# container/proxy that serves the rest of the site.
Alias /ESCSim/ /var/www/am32.tridgell.net/html/ESCSim/

<Directory /var/www/am32.tridgell.net/html/ESCSim/>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<LocationMatch "^/ESCSim/v1/(catalog\.json|index\.html)$">
    Header set Cache-Control "no-cache, max-age=0"
</LocationMatch>

<LocationMatch "^/ESCSim/v1/(firmware|bootloader)/[^/]+/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
