name: native

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Build and test native library (POSIX)
        if: runner.os != 'Windows'
        run: python scripts/build-package.py --skip-pyinstaller
      - name: Build and test native library (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python scripts/build-package.py --skip-pyinstaller
      - uses: actions/upload-artifact@v4
        with:
          name: am32sim-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/package-native-*/*.dll
            build/package-native-*/*.so
            build/package-native-*/*.dylib
          if-no-files-found: error
