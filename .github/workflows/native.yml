name: native

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build-package.py --skip-pyinstaller
      - uses: actions/upload-artifact@v4
        with:
          name: am32sim-${{ runner.os }}-${{ runner.arch }}
          path: |
            src/escsim/renode/lib/*.dll
            src/escsim/renode/lib/*.so
            src/escsim/renode/lib/*.dylib
          if-no-files-found: error
