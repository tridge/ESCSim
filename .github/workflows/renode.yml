name: renode-parity

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Artifact repository v1 URL
        default: https://firmware.ardupilot.org/Tools/AM32-tools/ESCSim/v1/
  schedule:
    - cron: "17 14 * * *"

jobs:
  spin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[gui]'
      - run: python scripts/build-package.py --skip-pyinstaller
      - name: ELF/HEX PWM, DShot600 and BDShot parity
        env:
          BASE_URL: ${{ inputs.base_url || 'https://firmware.ardupilot.org/Tools/AM32-tools/ESCSim/v1/' }}
        run: >-
          python scripts/run-parity-tests.py
          --base-url "$BASE_URL"
          --output parity-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renode-parity-report
          path: parity-report.json
          if-no-files-found: warn
