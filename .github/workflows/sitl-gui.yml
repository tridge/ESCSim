name: sitl-gui

# Packages the SITL control GUI and the calibration capture GUI as
# single executables for Linux and Windows. The SITL binary is bundled
# with the control GUI so it runs the simulator out of the box;
# PyInstaller does not cross compile, so each platform builds its own.

on:
  push:
    paths: ["SITL/**", ".github/workflows/sitl-gui.yml"]
  pull_request:
    paths: ["SITL/**", ".github/workflows/sitl-gui.yml"]
  workflow_dispatch:

jobs:
  # cross-compile the native Windows SITL exe on Linux with MinGW-w64,
  # so the Windows packaging job bundles a dependency-free binary (no
  # cygwin1.dll) that runs the real-time simulator reliably
  sitl-windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the firmware submodule
        run: git submodule update --init --depth 1 modules/am32-firmware

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Cross-build native Windows SITL
        run: |
          make -C modules/am32-firmware AM32_SITL_CAN SITL_CROSS=win
          mkdir -p sitl-windows
          cp modules/am32-firmware/obj/AM32_AM32_SITL_CAN_*.elf \
             sitl-windows/AM32_SITL_CAN.exe

      - uses: actions/upload-artifact@v4
        with:
          name: sitl-windows-exe
          path: sitl-windows/AM32_SITL_CAN.exe

  sitl-gui:
    needs: [sitl-windows-exe]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: am32-sitl-gui-linux
            binary: dist/am32-sitl-gui
          - os: windows-latest
            artifact: am32-sitl-gui-windows
            binary: dist/am32-sitl-gui.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the firmware submodule
        run: git submodule update --init --depth 1 modules/am32-firmware

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libfontconfig1 \
                                  libdbus-1-3 libxcb-cursor0

      # the SITL is bundled so the GUI runs the simulator out of the box
      - name: Build SITL (Linux)
        if: runner.os == 'Linux'
        run: make -C modules/am32-firmware AM32_SITL_CAN

      - name: Download native Windows SITL
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: sitl-windows-exe
          path: sitl-windows

      - name: Install build dependencies
        # a clean environment on purpose: a system python with other Qt
        # bindings or unrelated packages inflates the bundle
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r SITL/requirements.txt pyinstaller

      - name: Build executable
        run: python3 SITL/build_sitl_gui.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  capture-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: am32-capture-linux
            binary: dist/am32-capture
          - os: windows-latest
            artifact: am32-capture-windows
            binary: dist/am32-capture.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libfontconfig1 \
                                  libdbus-1-3 libxcb-cursor0

      - name: Install build dependencies
        # a clean environment on purpose: building against a system
        # python that has other Qt bindings or unrelated packages
        # installed inflates the bundle several times over
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r SITL/scripts/requirements-capture-gui.txt pyinstaller
          python3 -m pip uninstall -y matplotlib || true

      - name: Build executable
        run: python3 SITL/scripts/build_capture_gui.py

      # runs on both: the Windows binary is the one end users get, and
      # the frozen multiprocessing path that mavcan needs behaves
      # differently there
      - name: Smoke test the executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 SITL/scripts/capture_gui_test.py --binary ${{ matrix.binary }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
