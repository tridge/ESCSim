name: publisher

on:
  push:
  pull_request:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - run: pytest -q tests/test_artifacts.py
      - run: python -m json.tool schemas/catalog-v1.schema.json >/dev/null
      - run: python -m json.tool schemas/manifest-v1.schema.json >/dev/null
