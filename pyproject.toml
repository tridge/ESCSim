[build-system]
requires = ["setuptools>=75", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "escsim"
version = "0.1.0.dev0"
description = "Standalone Renode-based AM32 ESC simulator"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [{name = "AM32 project"}]
dependencies = [
    "platformdirs>=4.0",
    "pyelftools>=0.32",
]

[project.optional-dependencies]
gui = [
    "dronecan",
    "numpy>=2.0",
    "pyqtgraph>=0.13",
    "PySide6>=6.8",
    "pyserial>=3.5",
]
test = [
    "pytest>=8",
    "ruff==0.16.4",
]

[project.scripts]
escsim = "escsim.__main__:main"
escsim-publisher = "escsim.artifacts.publisher:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
license-files = ["LICENSE", "licenses/*.txt"]

[tool.setuptools.package-data]
escsim = [
    "resources/*.h",
    "resources/*.png",
    "renode/resources/models/*.json",
    "renode/resources/peripherals/*/*.cs",
    "renode/resources/platforms/*.repl",
    "renode/resources/scripts/*.py",
    "renode/resources/scripts/*.resc",
    "renode/resources/sim/*",
    "renode/lib/*",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/escsim/renode/resources/scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
