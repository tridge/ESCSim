[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "escsim"
version = "0.1.0.dev0"
description = "Standalone Renode-based AM32 ESC simulator"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{name = "AM32 project"}]
dependencies = [
    "platformdirs>=4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
escsim = "escsim.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
